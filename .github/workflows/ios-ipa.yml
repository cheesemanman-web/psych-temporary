
name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    env:
      PROJECT_PATH: PsychEngine.xcodeproj
      SCHEME: PsychEngine

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Find project schemes
        run: |
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Resolve dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME"


      - name: Archive iPhone app
        run: |
          set -o pipefail

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MyApp.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -jobs 1 \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/xcode-build.log"

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"

          APP=$(find "$RUNNER_TEMP/PsychEngine.xcarchive/Products/Applications" \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "No compiled iOS app found!"
            exit 1
          fi

          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent \
            Payload PsychEngine.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-iPhone-IPA
          path: ${{ runner.temp }}/PsychEngine.ipa
          if-no-files-found: error
