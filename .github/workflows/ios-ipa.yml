
name: Build Psych Engine iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PROJECT_PATH: PsychEngine.xcodeproj
  SCHEME: PsychEngine

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Haxe and Neko
        run: |
          brew install haxe neko

          echo "$(brew --prefix haxe)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix neko)/bin" >> "$GITHUB_PATH"

          haxe -version
          neko -version

      - name: Install repository Haxe dependencies
        run: |
          cd setup
          sh unix.sh

          haxelib set lime 8.1.2
          haxelib set openfl 9.3.3

          haxelib install hxcpp 4.3.0

      - name: Fix Windows paths in Build.hxml
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess

          build_file = pathlib.Path("PsychEngine/haxe/Build.hxml")

          if not build_file.exists():
              raise SystemExit(f"Missing file: {build_file}")

          original = build_file.read_text()
          updated = []

          for line in original.splitlines():
              match = re.match(
                  r"^(-cp )C:/HaxeToolkit/haxe/lib/([^/]+)/.*$",
                  line
              )

              if match:
                  library = match.group(2)

                  result = subprocess.run(
                      ["haxelib", "path", library],
                      capture_output=True,
                      text=True
                  )

                  if result.returncode != 0:
                      raise SystemExit(
                          f"Could not find Haxelib library: {library}\n"
                          + result.stderr
                      )

                  paths = [
                      item[4:].strip()
                      for item in result.stdout.splitlines()
                      if item.startswith("-cp ")
                  ]

                  if not paths:
                      raise SystemExit(
                          f"No classpath returned for {library}"
                      )

                  line = "-cp " + paths[0]
                  print(f"Fixed {library}: {paths[0]}")

              updated.append(line)

          build_file.write_text("\n".join(updated) + "\n")
          print("Build.hxml updated successfully.")
          PY

      - name: Verify Haxe environment
        run: |
          echo "=== Haxe ==="
          haxe -version

          echo "=== Haxelib ==="
          haxelib config
          haxelib list

          echo "=== OpenFL ==="
          haxelib path openfl

          echo "=== Build.hxml ==="
          cat PsychEngine/haxe/Build.hxml

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Archive iPhone app
        run: |
          set -o pipefail

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PsychEngine.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -jobs 1 \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/xcode-build.log"

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"

          APP=$(find "$RUNNER_TEMP/PsychEngine.xcarchive/Products/Applications" \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "No compiled iOS app found!"
            exit 1
          fi

          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          ditto -c -k --sequesterRsrc --keepParent \
            Payload PsychEngine-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-iOS-IPA
          path: ${{ runner.temp }}/PsychEngine-iOS.ipa
          if-no-files-found: error
