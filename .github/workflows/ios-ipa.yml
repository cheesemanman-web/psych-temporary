
name: Build Psych Engine iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PROJECT_PATH: PsychEngine.xcodeproj
  SCHEME: PsychEngine

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Haxe and Neko
        run: |
          brew install haxe neko
          echo "$(brew --prefix haxe)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix neko)/bin" >> "$GITHUB_PATH"

          haxe -version
          neko -version
          haxelib version

      - name: Configure Haxelib
        run: |
          haxelib setup "$HOME/haxelib"

      - name: Install Haxe compiler backend
        run: |
          haxelib install hxcpp

      - name: Install Psych Engine 1.0.4 dependencies
        run: |
          haxelib install lime 8.1.2
          haxelib install openfl 9.3.3

          haxelib set lime 8.1.2
          haxelib set openfl 9.3.3

          haxelib install flixel 5.6.1
          haxelib install flixel-addons 3.2.2
          haxelib install flixel-tools 1.5.1
          haxelib install hscript-iris 1.1.3
          haxelib install tjson 1.4.0
          haxelib install hxdiscord_rpc 1.2.4

          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e

          haxelib install hxcpp

      - name: Verify Haxe libraries
        run: |
          haxelib list

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Archive iPhone app
        run: |
          set -o pipefail

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PsychEngine.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -jobs 1 \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/xcode-build.log"

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"

          APP=$(find "$RUNNER_TEMP/PsychEngine.xcarchive/Products/Applications" \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "No compiled iOS app found!"
            exit 1
          fi

          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          ditto -c -k --sequesterRsrc --keepParent \
            Payload PsychEngine-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-iOS-IPA
          path: ${{ runner.temp }}/PsychEngine-iOS.ipa
          if-no-files-found: error
